name: Update plates every 15 minutes

on:
  schedule:
    # Kører hvert 15. minut:
    # xx:02, xx:17, xx:32 og xx:47
    #
    # Jeg forskyder den 2 minutter fra 00/15/30/45,
    # fordi GitHub ofte er mere belastet præcis på kvartererne.
    - cron: "2,17,32,47 * * * *"

  # Gør det muligt at starte workflowet manuelt
  workflow_dispatch:

jobs:
  bilopslag:
    name: Bilopslag
    runs-on: ubuntu-latest

    # Det nye script bør være langt hurtigere end de gamle.
    # Hvis noget går galt, stopper GitHub jobbet efter 30 min.
    timeout-minutes: 30

    steps:

      # ======================================================
      # 1. HENT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # 3. INSTALLER PAKKER
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 4. KØR DET ENESTE SCRAPER-SCRIPT
      # ======================================================

      - name: Run Bilopslag scraper
        env:
          JSON_FILE_PATH: /tmp/plates-bilopslag.json

          BILOPSLAG_COOKIES_JSON: ${{ secrets.BILOPSLAG_COOKIES_JSON }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          MAX_CONNECTIONS: "12"

          REQUEST_TIMEOUT: "25"

        run: |
          python -u "bilopslag.nu.sky.py"
