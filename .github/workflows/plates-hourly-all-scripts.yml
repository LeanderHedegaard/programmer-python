name: Update plates every 15 minutes

on:
  schedule:
    # GitHub cron bruger UTC.
    # Vi trigger bredt nok til både dansk sommer- og vintertid.
    # Selve scriptet får kun lov at køre 07:30-17:30 dansk tid.
    - cron: "0,15,30,45 5-16 * * 1-5"

  # Mulighed for manuel start
  workflow_dispatch:

jobs:
  bilopslag:
    name: Bilopslag
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ======================================================
      # 1. KONTROLLER DANSK TID
      # ======================================================

      - name: Check Danish time
        id: timecheck
        shell: bash
        run: |
          CURRENT_TIME=$(TZ=Europe/Copenhagen date +%H%M)
          CURRENT_DAY=$(TZ=Europe/Copenhagen date +%u)
          CURRENT_DISPLAY=$(TZ=Europe/Copenhagen date '+%Y-%m-%d %H:%M:%S %Z')

          echo "Dansk tid nu: $CURRENT_DISPLAY"

          # Mandag = 1
          # ...
          # Fredag = 5

          if [ "$CURRENT_DAY" -ge 1 ] && [ "$CURRENT_DAY" -le 5 ] && \
             [ "$CURRENT_TIME" -ge 0730 ] && [ "$CURRENT_TIME" -le 1730 ]; then

            echo "✅ Inden for tidsvindue 07:30-17:30 mandag-fredag."
            echo "run_scraper=true" >> "$GITHUB_OUTPUT"

          else

            echo "⏭️ Uden for tidsvindue. Scraper køres ikke."
            echo "run_scraper=false" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # 2. CHECKOUT
      # ======================================================

      - name: Checkout repository
        if: steps.timecheck.outputs.run_scraper == 'true'
        uses: actions/checkout@v4


      # ======================================================
      # 3. PYTHON
      # ======================================================

      - name: Set up Python
        if: steps.timecheck.outputs.run_scraper == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # 4. INSTALLER PAKKER
      # ======================================================

      - name: Install dependencies
        if: steps.timecheck.outputs.run_scraper == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 5. KØR BILOPSLAG-SCRIPTET
      # ======================================================

      - name: Run Bilopslag scraper
        if: steps.timecheck.outputs.run_scraper == 'true'

        env:
          JSON_FILE_PATH: /tmp/plates-bilopslag.json

          BILOPSLAG_COOKIES_JSON: ${{ secrets.BILOPSLAG_COOKIES_JSON }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          MAX_CONNECTIONS: "20"

          REQUEST_TIMEOUT: "20"

          PROGRESS_EVERY: "25"

        run: |
          python -u "bilopslag.nu.sky.py"
