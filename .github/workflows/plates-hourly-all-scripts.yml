name: Update plates every 30 minutes

on:
  schedule:
    # Cirka hvert 30. minut, lidt forskudt fra hel og halv time
    - cron: "7,37 * * * *"

  # Gør det muligt at starte manuelt
  workflow_dispatch:

# Ingen cancel-in-progress.
# Hvis et tidligere run stadig arbejder, venter det næste i køen.
concurrency:
  group: update-plates-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bilopslag:
    name: Bilopslag
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bilopslag
        env:
          JSON_FILE_PATH: /tmp/plates-bilopslag.json
          BILOPSLAG_COOKIES_JSON: ${{ secrets.BILOPSLAG_COOKIES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -u "bilopslag.nu.sky.py"

  en:
    name: EN
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify EN prefix
        run: |
          grep 'PREFIX =' "EN_med_print_til_plates_supabase.py"

      - name: Run EN
        env:
          JSON_FILE_PATH: /tmp/plates-en.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -u "EN_med_print_til_plates_supabase.py"

  ep:
    name: EP
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify EP prefix
        run: |
          grep 'PREFIX =' "EP_med_print_til_plates_json_supabase.py"

      - name: Run EP
        env:
          JSON_FILE_PATH: /tmp/plates-ep.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -u "EP_med_print_til_plates_json_supabase.py"
